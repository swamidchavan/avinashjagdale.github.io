    <script>
        (function () {
            const expandButton = document.getElementById('galleryExpand');
            const hiddenCards = document.querySelectorAll('.gallery-more');
            if (!expandButton || !hiddenCards.length) return;
            expandButton.addEventListener('click', () => {
                const expanded = expandButton.dataset.expanded === 'true';
                hiddenCards.forEach(card => card.classList.toggle('hidden', expanded));
                expandButton.textContent = expanded ? 'Show More' : 'Show Less';
                expandButton.dataset.expanded = expanded ? 'false' : 'true';
            });
        })();
    </script>
